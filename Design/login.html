<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crush On You - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }

        .logo-pink {
            background: linear-gradient(135deg, #ff69b4, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="flex items-center justify-center mb-8">
            <div class="flex items-center gap-2">
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center text-white text-2xl shadow-lg">
                    ❤️
                </div>
                <h1 class="text-3xl font-bold logo-pink">Crush On You</h1>
            </div>
        </div>

        <!-- Login Card -->
        <div class="glass rounded-3xl shadow-2xl p-8 border border-white/50">
            <h2 class="text-2xl font-semibold text-center text-gray-800 mb-2">Bienvenido de nuevo</h2>
            <p class="text-center text-gray-500 mb-8">Inicia sesión para continuar conociendo gente especial</p>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Usuario o correo electrónico</label>
                    <input type="text" required
                        class="w-full px-5 py-3 rounded-2xl border border-gray-200 focus:border-pink-400 focus:ring-2 focus:ring-pink-200 outline-none transition-all"
                        placeholder="vera.cherry@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" required
                        class="w-full px-5 py-3 rounded-2xl border border-gray-200 focus:border-pink-400 focus:ring-2 focus:ring-pink-200 outline-none transition-all"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" class="w-4 h-4 accent-pink-500">
                        <span class="text-gray-600">Recordarme</span>
                    </label>
                    <a href="#" class="text-pink-500 hover:text-pink-600 transition-colors">¿Olvidaste tu
                        contraseña?</a>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold rounded-2xl hover:brightness-105 active:scale-[0.98] transition-all shadow-lg">
                    Iniciar Sesión
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-gray-600">
                    ¿No tienes cuenta?
                    <a href="#" class="font-semibold text-pink-500 hover:text-pink-600">Regístrate gratis</a>
                </p>
            </div>

            <!-- Decorative elements -->
            <div class="flex justify-center gap-6 mt-8 text-4xl opacity-30">
                <span>🌸</span>
                <span>💕</span>
                <span>🌷</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-gray-400 mt-6">
            © 2026 Crush On You • Bremen, Germany
        </div>
    </div>

</body>

</html>
